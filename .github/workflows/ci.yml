name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Record new Roborazzi reference images (Linux is the source of truth)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, lint and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # Unit + Robolectric tests of every module (the DataStore corruption test skipped on Windows runs here),
      # ktlint, Android Lint against the committed baselines, a dev debug build, and the minified prod release
      # with the check that R8 kept every navigation route.
      - run: ./gradlew test ktlintCheck lint assembleDevDebug assembleProdRelease verifyReleaseKeeps
      - name: Verify screenshots
        if: hashFiles('core/designsystem/src/test/screenshots/**') != ''
        run: ./gradlew :core:designsystem:verifyRoborazziDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  examples-removed:
    name: App still builds and tests without the examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Copy the project and remove every example feature
        run: |
          rsync -a --exclude .git ./ "$RUNNER_TEMP/no-examples/"
          chmod +x "$RUNNER_TEMP/no-examples/gradlew"
          bash scripts/remove-examples.sh "$RUNNER_TEMP/no-examples"
      - name: Build and test the copy
        working-directory: ${{ runner.temp }}/no-examples
        run: ./gradlew test assembleDevDebug

  record-screenshots:
    name: Record screenshot references
    if: github.event_name == 'workflow_dispatch' && inputs.record_screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:designsystem:recordRoborazziDebug
      - name: Upload the recorded images (commit them to core/designsystem/src/test/screenshots/)
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: core/designsystem/src/test/screenshots/
